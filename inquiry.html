  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Switzer','Segoe UI', Arial, sans-serif; background:var(--brand-cream,#f5f4ef); color:#1a1a1a; }
    .header { background:var(--brand-dark,#141414); color:#fff; padding:18px 20px; display:flex; justify-content:space-between; align-items:center; }
    .langtoggle { display:flex; gap:4px; }
    .langtoggle button { background:#333; color:#aaa; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; }
    .langtoggle button.active { background:#e0912f; color:#1a1a1a; }

    .container { max-width:560px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 16px rgba(0,0,0,0.08); }
    .intro-title { font-size:20px; font-weight:700; margin-bottom:4px; }
    .intro-sub { font-size:13px; color:#888; margin-bottom:22px; }

    label { display:block; font-size:12px; font-weight:700; letter-spacing:0.5px; margin-bottom:6px; color:#333; }
    label .req { color:#cc3333; }
    input, textarea { width:100%; padding:11px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; font-family:inherit; margin-bottom:16px; }
    input:focus, textarea:focus { outline:none; border-color:#e0912f; }
    textarea { resize:vertical; min-height:90px; }

    .uploader { border:2px dashed #ccc; border-radius:10px; padding:18px; text-align:center; cursor:pointer; margin-bottom:8px; }
    .uploader:hover { border-color:#e0912f; background:#faf7f2; }
    .uploader span { font-size:13px; color:#888; }
    .hint { font-size:11px; color:#aaa; margin-bottom:16px; }
    #previews { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .thumb { position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid #ddd; }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .thumb b { position:absolute; top:1px; right:3px; color:#fff; background:rgba(0,0,0,0.6); border-radius:50%; width:16px; height:16px; font-size:11px; line-height:16px; text-align:center; cursor:pointer; }

    .submit-btn { width:100%; padding:14px; background:#1a1a1a; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; letter-spacing:1px; cursor:pointer; }
    .submit-btn:disabled { background:#999; cursor:default; }
    .submit-btn:hover:not(:disabled) { background:#333; }

    .success { text-align:center; padding:30px 10px; }
    .success .big { font-size:44px; margin-bottom:8px; }
    .success h2 { font-size:20px; margin-bottom:8px; }
    .success p { font-size:14px; color:#666; }
    .success .refid { display:inline-block; margin-top:12px; background:#1a1a1a; color:#fff; padding:6px 16px; border-radius:20px; font-weight:700; letter-spacing:1px; }
    .errmsg { color:#cc3333; font-size:13px; margin-bottom:12px; text-align:center; display:none; }
    .footer { text-align:center; margin-top:16px; font-size:11px; color:#bbb; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-logo" role="img" aria-label="Revolt Industry"></div>
    <div class="langtoggle">
      <button id="btn-id" onclick="setLang('id')">ID</button>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="container">
    <div class="card" id="formcard">
      <div class="intro-title" id="t-title"></div>
      <div class="intro-sub" id="t-sub"></div>

      <div class="errmsg" id="errmsg"></div>

      <label id="l-nama"></label>
      <input id="f-nama" type="text">

      <label id="l-phone"></label>
      <input id="f-phone" type="tel" inputmode="tel">

      <label id="l-email"></label>
      <input id="f-email" type="email" inputmode="email">

      <label id="l-dob"></label>
      <input id="f-dob" type="date">

      <label id="l-address"></label>
      <input id="f-address" type="text">

      <label id="l-produk"></label>
      <input id="f-produk" type="text">

      <label id="l-spec"></label>
      <textarea id="f-spec"></textarea>

      <label id="l-qty"></label>
      <input id="f-qty" type="text" inputmode="numeric">

      <label id="l-images"></label>
      <div class="uploader" onclick="document.getElementById('f-images').click()">
        <span id="t-upload"></span>
      </div>
      <div class="hint" id="t-hint"></div>
      <input id="f-images" type="file" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
      <div id="previews"></div>

      <button class="submit-btn" id="submitbtn" onclick="submitForm()"></button>
    </div>
    <div class="footer">revolt industry</div>
  </div>

<script>
  function detectLang(){
    var l = (navigator.language || navigator.userLanguage || '').toLowerCase();
    return l.indexOf('id') === 0 ? 'id' : 'en';   // browser Indonesia → ID, selain itu → EN
  }
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbytT2sBQnWArb78bUDAGW1yHn1iW5yXGlTw_nZ6fSt6ak54OUOIUcJ2ZgoR6n4z3KKP/exec';
  var URL_LANG = (new URLSearchParams(location.search)).get('lang');
  var LANG = ('' || URL_LANG || detectLang());   // appscript template → ?lang= → auto-deteksi
  var IMAGES = [];   // { name, mimeType, data(base64), preview(dataURL) }
  var MAX_IMAGES = 8;

  var T = {
    id: {
      title:'Formulir Pesanan Custom', sub:'Ceritakan produk yang ingin kamu buat.',
      nama:'Nama Lengkap', phone:'WhatsApp / No. HP', email:'Email', dob:'Tanggal Lahir', address:'Alamat',
      produk:'Nama Produk', produkPh:'Contoh: Dompet, Tas Kulit, Belt…',
      spec:'Spesifikasi Produk yang Diinginkan', specPh:'Bahan, warna, ukuran, model, referensi…',
      qty:'Jumlah (Qty)', images:'Gambar Referensi', upload:'📷 Ketuk untuk pilih gambar',
      hint:'Maksimal 8 gambar. Gambar otomatis dikecilkan.', submit:'Kirim Inquiry', sending:'Mengirim…',
      req:'Mohon isi Nama, No. HP, dan Email.', emailInvalid:'Format email belum benar.', tooMany:'Maksimal 8 gambar.',
      okTitle:'Inquiry Terkirim!', okMsg:'Terima kasih! Tim kami akan segera menghubungi kamu. Nomor referensimu:',
      fail:'Gagal mengirim. Coba lagi ya.'
    },
    en: {
      title:'Custom Order Inquiry', sub:'Tell us what you would like to create.',
      nama:'Full Name', phone:'WhatsApp / Phone', email:'Email', dob:'Date of Birth', address:'Address',
      produk:'Product Name', produkPh:'e.g. Wallet, Leather Bag, Belt…',
      spec:'Desired Product Specification', specPh:'Material, color, size, style, references…',
      qty:'Quantity', images:'Reference Images', upload:'📷 Tap to choose images',
      hint:'Up to 8 images. Images are auto-compressed.', submit:'Submit Inquiry', sending:'Sending…',
      req:'Please fill Name, Phone, and Email.', emailInvalid:'Please enter a valid email.', tooMany:'Maximum 8 images.',
      okTitle:'Inquiry Received!', okMsg:'Thank you! Our team will contact you shortly. Your reference:',
      fail:'Failed to send. Please try again.'
    }
  };

  function setLang(l){
    LANG = l;
    var t = T[l];
    document.getElementById('btn-id').className = l==='id' ? 'active' : '';
    document.getElementById('btn-en').className = l==='en' ? 'active' : '';
    document.getElementById('t-title').textContent = t.title;
    document.getElementById('t-sub').textContent = t.sub;
    document.getElementById('l-nama').innerHTML = t.nama + ' <span class="req">*</span>';
    document.getElementById('l-phone').innerHTML = t.phone + ' <span class="req">*</span>';
    document.getElementById('l-email').innerHTML = t.email + ' <span class="req">*</span>';
    document.getElementById('l-dob').textContent = t.dob;
    document.getElementById('l-address').textContent = t.address;
    document.getElementById('l-produk').textContent = t.produk;
    document.getElementById('f-produk').placeholder = t.produkPh;
    document.getElementById('l-spec').textContent = t.spec;
    document.getElementById('f-spec').placeholder = t.specPh;
    document.getElementById('l-qty').textContent = t.qty;
    document.getElementById('l-images').textContent = t.images;
    document.getElementById('t-upload').textContent = t.upload;
    document.getElementById('t-hint').textContent = t.hint;
    document.getElementById('submitbtn').textContent = t.submit;
  }

  // Resize gambar ke maks 1600px, JPEG 0.85 → payload kecil & upload stabil
  function processFile(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var max = 1600, w = img.width, h = img.height;
          if (w > max || h > max){ if (w > h){ h = Math.round(h*max/w); w = max; } else { w = Math.round(w*max/h); h = max; } }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          resolve({ name:(file.name||'ref')+'.jpg', mimeType:'image/jpeg', data:dataUrl.split(',')[1], preview:dataUrl });
        };
        img.onerror = function(){ resolve(null); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ resolve(null); };
      reader.readAsDataURL(file);
    });
  }

  function handleFiles(files){
    var arr = Array.prototype.slice.call(files);
    arr.forEach(function(f){
      if (IMAGES.length >= MAX_IMAGES){ alert(T[LANG].tooMany); return; }
      if (!/^image\//.test(f.type)) return;
      processFile(f).then(function(obj){ if (obj){ IMAGES.push(obj); renderPreviews(); } });
    });
    document.getElementById('f-images').value = '';
  }

  function renderPreviews(){
    document.getElementById('previews').innerHTML = IMAGES.map(function(im, i){
      return '<div class="thumb"><img src="'+im.preview+'"><b onclick="removeImg('+i+')">×</b></div>';
    }).join('');
  }
  function removeImg(i){ IMAGES.splice(i,1); renderPreviews(); }

  function submitForm(){
    var t = T[LANG];
    var nama = document.getElementById('f-nama').value.trim();
    var phone = document.getElementById('f-phone').value.trim();
    var email = document.getElementById('f-email').value.trim();
    var dob = document.getElementById('f-dob').value.trim();
    var err = document.getElementById('errmsg');
    if (!nama || !phone || !email){ err.textContent = t.req; err.style.display='block'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = t.emailInvalid; err.style.display='block'; return; }
    err.style.display='none';

    var btn = document.getElementById('submitbtn');
    btn.disabled = true; btn.textContent = t.sending;

    var payload = {
      nama:nama, phone:phone, email:email, dob:dob,
      address:document.getElementById('f-address').value.trim(),
      produk:document.getElementById('f-produk').value.trim(),
      spec:document.getElementById('f-spec').value.trim(),
      qty:document.getElementById('f-qty').value.trim(),
      lang:LANG,
      images:IMAGES.map(function(im){ return { name:im.name, mimeType:im.mimeType, data:im.data }; })
    };

    sendInquiry(payload,
      function(res){
        if (res && res.ok){ showSuccess(res.inquiryId); }
        else { err.textContent = (res && res.error) || t.fail; err.style.display='block'; btn.disabled=false; btn.textContent=t.submit; }
      },
      function(e){ err.textContent = t.fail + (e && e.message ? ' ('+e.message+')' : ''); err.style.display='block'; btn.disabled=false; btn.textContent=t.submit; });
  }

  // Dual-mode: Apps Script (google.script.run) atau standalone/Pages (POST via hidden form)
  function sendInquiry(payload, ok, fail){
    if (typeof google !== 'undefined' && google.script && google.script.run){
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail).submitInquiry(payload);
    } else {
      try {
        var iframe=document.getElementById('subframe');
        if(!iframe){ iframe=document.createElement('iframe'); iframe.name='subframe'; iframe.id='subframe'; iframe.style.display='none'; document.body.appendChild(iframe); }
        var form=document.createElement('form'); form.method='POST'; form.action=WEB_APP_URL; form.target='subframe';
        function add(n,v){ var i=document.createElement('input'); i.type='hidden'; i.name=n; i.value=v; form.appendChild(i); }
        add('action','submitInquiry'); add('payload', JSON.stringify(payload));
        document.body.appendChild(form); form.submit();
        setTimeout(function(){ if(form.parentNode) form.parentNode.removeChild(form); ok({ ok:true }); }, 2800);
      } catch(e){ fail(e); }
    }
  }

  function showSuccess(id){
    var t = T[LANG];
    document.getElementById('formcard').innerHTML =
      '<div class="success"><div class="big">✅</div>' +
      '<h2>'+t.okTitle+'</h2><p>'+t.okMsg+'</p>' +
      (id ? '<div class="refid">'+id+'</div>' : '') + '</div>';
  }

  setLang(LANG === 'en' ? 'en' : 'id');
</script>
</body>
</html>
