<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – Revolt Industry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #12120f; color: #ececec; }

    .header { background: #000; padding: 16px 24px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
    .header .ts { font-size: 11px; color: #888; }

    .wrap { max-width: 1240px; margin: 24px auto; padding: 0 20px; }

    .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid #2a2a22; }
    .tab { background: none; border: none; color: #888; font-size: 13px; font-weight: 700; padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #e0912f; border-bottom-color: #e0912f; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .kpi { background: #1c1c17; border: 1px solid #2a2a22; border-radius: 10px; padding: 16px; }
    .kpi label { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #999; margin-bottom: 6px; }
    .kpi .val { font-size: 22px; font-weight: 700; }
    .kpi .val.money { font-size: 18px; }
    .kpi.accent { border-color: #b5762e; }
    .kpi.accent .val { color: #e0912f; }

    .section-title { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #999; margin: 26px 0 10px; }

    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar input, .toolbar select { padding: 9px 12px; background: #1c1c17; border: 1px solid #2a2a22; border-radius: 8px; color: #ececec; font-size: 13px; }
    .toolbar input { flex: 1; min-width: 220px; }

    .wrap table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .wrap th, .wrap td { text-align: left; padding: 6px 7px; border-bottom: 1px solid #242420; white-space: normal; word-break: break-word; overflow-wrap: anywhere; vertical-align: top; }
    .wrap th { font-size: 10px; letter-spacing: 0.3px; text-transform: uppercase; color: #888; position: sticky; top: 0; background: #14140f; z-index: 1; }
    .wrap th.sortable { cursor: pointer; user-select: none; }
    .wrap th.sortable:hover { color: #e0912f; }
    .wrap th[data-dir]::after { content: ' ▾'; color: #e0912f; }
    .wrap th[data-dir="asc"]::after { content: ' ▴'; color: #e0912f; }
    .wrap td.num, .wrap th.num { text-align: right; white-space: nowrap; }
    .table-scroll { overflow: auto; border: 1px solid #242420; border-radius: 10px; }
    .table-scroll.tall { max-height: 68vh; }
    .wrap tbody tr:hover { background: #191914; }
    .wrap .edit { cursor: text; }
    .wrap .edit:focus { outline: 1px solid #e0912f; background: #191914; }
    .wrap td .cbtn { padding: 2px 6px; margin: 1px 0; }
    .wrap .mini td, .wrap .mini th { padding: 6px 8px; }

    .badge { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 11px; font-weight: 700; color: #fff; }
    a.link { color: #e0912f; text-decoration: none; }
    a.link:hover { text-decoration: underline; }
    .cbtn { background: #2a2a22; border: 1px solid #3a3a30; color: #e0912f; font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
    .cbtn:hover { background: #33332a; }
    .istatus { background: #1c1c17; color: #ececec; border: 1px solid #3a3a30; border-radius: 6px; padding: 4px 6px; font-size: 12px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .mini td, .mini th { padding: 7px 10px; }

    .loading, .error { text-align: center; padding: 60px; color: #888; }

    /* ── Invoice modal ── */
    #invModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; overflow: auto; padding: 20px; }
    #invModal.show { display: block; }
    .inv-wrap { max-width: 860px; margin: 0 auto; }
    .inv-bar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; }
    .inv-bar button { padding: 9px 16px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .inv-dl { background: #e0912f; color: #141414; }
    .inv-save { background: #16a34a; color: #fff; }
    .inv-cls { background: #333; color: #fff; }
    #invPaper { background: #fff; color: #111; width: 820px; margin: 0 auto; padding: 40px 44px; font-family: Arial, Helvetica, sans-serif; }
    #invPaper .ed { border-bottom: 1px dashed #bbb; min-width: 30px; display: inline-block; outline: none; }
    #invPaper .ed:focus { background: #fff7ec; }
    #invPaper td[contenteditable]:focus, #invPaper span[contenteditable]:focus { background: #fff7ec; outline: 1px solid #e0912f; }
    #invPaper.exporting .inv-x { display: none !important; }

    /* ── Custom Sheet ── */
    #sheetModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; overflow: auto; padding: 20px; }
    #sheetModal.show { display: block; }
    #sheetPaper { background: #fff; color: #111; width: 760px; margin: 0 auto; padding: 40px 44px; font-family: Arial, Helvetica, sans-serif; }
    #sheetPaper .imgslot { background: #ececec center/cover no-repeat; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px; border-radius: 2px; }
    #sheetPaper .imgslot:hover { outline: 2px solid #e0912f; }
    #sheetPaper [contenteditable]:focus { outline: 1px solid #e0912f; background: #fff7ec; }
    #sheetPaper .lbl { font-weight: 700; font-size: 12px; }
    #sheetPaper .sec { font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #b5762e; border-bottom: 2px solid #111; padding-bottom: 3px; margin: 16px 0 8px; }

    /* ── Purchase Order ── */
    #poModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; overflow: auto; padding: 20px; }
    #poModal.show { display: block; }
    #poPaper { background: #fff; color: #111; width: 1040px; margin: 0 auto; padding: 26px 30px; font-family: 'Courier New', monospace; }
    #poPaper td[contenteditable]:focus, #poPaper span[contenteditable]:focus { outline: 1px solid #e0912f; background: #fff7ec; }
    #poPaper table td, #poPaper table th { border: 1px solid #000; padding: 4px 5px; }
    #poPaper table th { font-weight: 700; text-align: center; }
    #poPaper.exporting .po-x { display: none !important; }

    /* ── Riwayat / Timeline ── */
    #tlModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; overflow: auto; padding: 20px; }
    #tlModal.show { display: block; }
    .tl-wrap { max-width: 560px; margin: 0 auto; background: #1c1c17; border: 1px solid #2a2a22; border-radius: 12px; padding: 20px 22px; }
    .tl-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .tl-head h3 { font-size: 16px; color: #f5f4ef; }
    .tl { position: relative; margin: 6px 0 4px; padding-left: 20px; }
    .tl:before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: #33332a; }
    .tl-item { position: relative; padding: 8px 0 8px 4px; }
    .tl-dot { position: absolute; left: -20px; top: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #1c1c17; }
    .tl-when { font-size: 11px; color: #8f8f85; letter-spacing: .3px; }
    .tl-label { font-size: 13px; color: #ececec; margin-top: 2px; word-break: break-word; }
    .tl-badge { display: inline-block; font-size: 10px; font-weight: 700; background: #33332a; color: #e0c79a; padding: 1px 7px; border-radius: 20px; margin-left: 4px; }

    /* ── Warning badge + banner + analisa ── */
    .warn-badge { display: inline-block; font-size: 10px; font-weight: 700; background: #4a2c12; color: #ffbd6b; border: 1px solid #7a4a1e; padding: 0 6px; border-radius: 20px; cursor: help; }
    .warn-box { background: #241a10; border: 1px solid #6b4415; border-radius: 12px; padding: 12px 14px; margin: 16px 0 4px; }
    .warn-h { color: #ffbd6b; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
    .warn-row { display: block; width: 100%; text-align: left; background: transparent; border: none; border-top: 1px solid #3a2a16; color: #ddd; font-size: 12px; padding: 7px 2px; cursor: pointer; }
    .warn-row:first-of-type { border-top: none; }
    .warn-row:hover { color: #fff; }
    .an-box { border-radius: 10px; padding: 12px 14px; margin: 2px 0 14px; }
    .an-ok    { background: #14251a; border: 1px solid #26502f; }
    .an-warn  { background: #241a10; border: 1px solid #6b4415; }
    .an-alert { background: #2a1414; border: 1px solid #7a2020; }
    .an-h { font-weight: 800; font-size: 13px; margin-bottom: 5px; color: #f5f4ef; }
    .an-c { font-size: 13px; line-height: 1.55; color: #ececec; }
    .an-m { font-size: 11px; color: #9a9a90; margin-top: 7px; }
  </style>

  function render(d){
    DATA = d;
    document.getElementById('ts').textContent = 'Update: ' + d.generatedAt;
    var html =
      '<div class="tabs">' +
        '<button class="tab active" onclick="showTab(1,this)">Operasional</button>' +
        '<button class="tab" onclick="showTab(2,this)">Summary &amp; Laporan</button>' +
      '</div>' +
      '<div id="page1">' + buildOperasional(d) + '</div>' +
      '<div id="page2" style="display:none">' + buildLaporan(d) + '</div>';
    document.getElementById('content').innerHTML = html;
  }

  function showTab(n, btn){
    document.getElementById('page1').style.display = n===1 ? '' : 'none';
    document.getElementById('page2').style.display = n===2 ? '' : 'none';
    var tabs = document.querySelectorAll('.tab');
    for (var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
    btn.classList.add('active');
    if (n===2) filterReport();
  }

  // ── PAGE 1: Operasional ──
  function buildOperasional(d){
    var k = d.kpi;
    var kpis =
      kpiCard('Order Aktif', k.ongoingCount) +
      kpiCard('Nilai Order Aktif', rp(k.ongoingRevenue), 'accent') +
      kpiCard('DP Masuk', rp(k.ongoingDP)) +
      kpiCard('Sisa Tagihan', rp(k.ongoingRemaining)) +
      kpiCard('Omset Bulan Ini', rp(k.monthOmset), 'accent') +
      kpiCard('Profit Bulan Ini', rp(k.monthProfit)) +
      kpiCard('Order Selesai (bln ini)', k.monthOrders);

    return '<div class="kpis">' + kpis + '</div>' +
      warnBanner(d.orders) +
      '<div class="section-title">Order Aktif (' + d.orders.length + ')</div>' +
      '<div class="toolbar">' +
        '<input id="q" placeholder="Cari order / customer / produk…" oninput="filterOrders()">' +
        '<select id="fpay" onchange="filterOrders()"><option value="">Semua bayar</option><option>Belum</option><option>DP</option><option>Lunas</option></select>' +
        '<select id="fdl" onchange="filterOrders()"><option value="">Semua deadline</option><option value="near">≤ 3 hari</option><option value="over">Terlewat</option></select>' +
        '<label style="color:#e0912f;font-size:12px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="fwarn" onchange="filterOrders()"> Cuma yang ⚠</label>' +
      '</div>' +
      '<div class="table-scroll tall"><table id="orders"><thead><tr>' +
        '<th class="sortable" onclick="sortT(this,0)">Order</th>' +
        '<th class="sortable" onclick="sortT(this,1)">Customer</th>' +
        '<th>Produk</th><th>Tipe</th><th>Kategori</th>' +
        '<th class="num sortable" onclick="sortT(this,5)">Qty</th>' +
        '<th class="num sortable" onclick="sortT(this,6)">Harga</th>' +
        '<th class="num sortable" onclick="sortT(this,7)">HPP</th>' +
        '<th class="num sortable" onclick="sortT(this,8)">Margin</th>' +
        '<th class="sortable" onclick="sortT(this,9)">Bayar</th>' +
        '<th class="num sortable" onclick="sortT(this,10)">Sisa</th>' +
        '<th class="sortable" onclick="sortT(this,11)">Deadline</th>' +
        '<th class="sortable" onclick="sortT(this,12)">Status</th>' +
        '<th>Link</th><th>Dok</th>' +
      '</tr></thead><tbody>' + orderRows(d.orders) + '</tbody></table></div>' +

      '<div class="section-title">Inquiry Masuk (' + (d.inquiries ? d.inquiries.length : 0) + ') — klik sel Nama/Email/Alamat/Spesifikasi untuk edit</div>' +
      '<div class="table-scroll"><table id="inquiries"><thead><tr>' +
        '<th class="sortable" onclick="sortT(this,0)">Waktu</th>' +
        '<th class="sortable" onclick="sortT(this,1)">ID</th>' +
        '<th class="sortable" onclick="sortT(this,2)">Nama</th>' +
        '<th>Phone</th>' +
        '<th class="sortable" onclick="sortT(this,4)">Email</th>' +
        '<th>Lahir</th><th>Alamat</th><th>Spesifikasi</th><th class="num">Qty</th>' +
        '<th>Bhs</th><th>Gambar</th>' +
        '<th class="sortable" onclick="sortT(this,11)">Status</th><th>Aksi</th>' +
      '</tr></thead><tbody>' + inquiryRows(d.inquiries || [], d.inqStatuses || []) + '</tbody></table></div>';
  }

  // ── PAGE 2: Summary & Laporan ──
  function buildLaporan(d){
    var s = d.summary || { moneyIn:0, payments:[], birthdays:[] };
    var bdayToday = s.birthdays.filter(function(b){ return b.isToday; }).length;

    // opsi bulan (dari order selesai)
    var months = {};
    (d.completed || []).forEach(function(c){ if (c.monthKey) months[c.monthKey] = c.monthLabel; });
    var monthKeys = Object.keys(months).sort().reverse();
    var monthOpts = '<option value="">Semua bulan</option>' + monthKeys.map(function(mk){ return '<option value="'+mk+'">'+esc(months[mk])+'</option>'; }).join('');

    // Ringkasan per bulan (dari order selesai)
    var byMonth = {};
    (d.completed || []).forEach(function(c){
      var mk = c.monthKey || 'zzz';
      if (!byMonth[mk]) byMonth[mk] = { label: c.monthLabel || '(tanpa tgl)', order:0, omset:0, hpp:0 };
      byMonth[mk].order++; byMonth[mk].omset += Number(c.hargaJual)||0; byMonth[mk].hpp += Number(c.hpp)||0;
    });
    var mkeys = Object.keys(byMonth).sort().reverse();
    var monthSummary =
      '<div class="table-scroll"><table class="mini"><thead><tr>' +
        '<th>Bulan</th><th class="num">Order</th><th class="num">Omset</th><th class="num">HPP</th><th class="num">Profit</th>' +
      '</tr></thead><tbody>' +
      (mkeys.length ? mkeys.map(function(mk){ var m=byMonth[mk];
        return '<tr><td><b>'+esc(m.label)+'</b></td><td class="num">'+m.order+'</td><td class="num">'+rp(m.omset)+'</td><td class="num">'+rp(m.hpp)+'</td><td class="num" style="color:#e0912f">'+rp(m.omset-m.hpp)+'</td></tr>';
      }).join('') : '<tr><td colspan="5" style="color:#888">Belum ada order selesai.</td></tr>') +
      '</tbody></table></div>';

    return '<div class="section-title">Summary Bulan Ini</div>' +
      '<div class="kpis">' +
        kpiCard('Uang Masuk Bulan Ini', rp(s.moneyIn), 'accent') +
        kpiCard('Jumlah Pembayaran', s.payments.length) +
        kpiCard('Ulang Tahun Bulan Ini', s.birthdays.length + (bdayToday ? ' 🎂' : '')) +
      '</div>' +
      '<div class="grid2">' +
        '<div><div class="section-title">Pembayaran Masuk</div>' + paymentsTable(s.payments) + '</div>' +
        '<div><div class="section-title">🎂 Ulang Tahun (kirim ucapan)</div>' + birthdayList(s.birthdays) + '</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div><div class="section-title">Produk Terlaris</div>' + miniTable(d.byProduct) + '</div>' +
        '<div><div class="section-title">Kategori Terlaris</div>' + miniTable(d.byCategory) + '</div>' +
      '</div>' +

      '<div class="section-title">Laporan Order Selesai — Ringkasan per Bulan</div>' +
      monthSummary +
      '<div class="section-title">Detail Order Selesai</div>' +
      '<div class="toolbar">' +
        '<select id="fmonth" onchange="filterReport()">' + monthOpts + '</select>' +
        '<span id="reptotal" style="color:#bbb;font-size:12px"></span>' +
      '</div>' +
      '<div class="table-scroll tall"><table id="report"><thead><tr>' +
        '<th class="sortable" onclick="sortT(this,0)">Order</th>' +
        '<th class="sortable" onclick="sortT(this,1)">Customer</th>' +
        '<th>Produk</th><th>Kategori</th>' +
        '<th class="num sortable" onclick="sortT(this,4)">Qty</th>' +
        '<th class="num sortable" onclick="sortT(this,5)">HPP</th>' +
        '<th class="num sortable" onclick="sortT(this,6)">Harga Jual</th>' +
        '<th class="num sortable" onclick="sortT(this,7)">Margin</th>' +
        '<th>Tgl DP</th><th>Tgl Pelunasan</th>' +
        '<th class="sortable" onclick="sortT(this,10)">Selesai</th>' +
        '<th>Link</th><th>Sheet</th>' +
      '</tr></thead><tbody>' + reportRows(d.completed || []) + '</tbody></table></div>';
  }

  // ── Banner peringatan: order berjalan terlalu lama / lewat deadline ──
  function warnBanner(orders){
    var flagged = (orders||[]).filter(function(o){ var w=o.warn||{}; return w.aging || w.overdue; });
    if (!flagged.length) return '';
    flagged.sort(function(a,b){ return (b.warn.ageDays||0)-(a.warn.ageDays||0); });
    var items = flagged.map(function(o){
      var w=o.warn, tags=[];
      if (w.aging) tags.push(w.ageDays+' hari sejak inquiry');
      if (w.overdue) tags.push('lewat deadline '+w.overdueDays+' hari');
      return '<button class="warn-row" onclick="openTimeline(\''+esc(o.orderId)+'\')" title="Klik lihat riwayat & analisa">'+
        '<b>'+esc(o.orderId)+'</b> '+esc(o.customer)+' — '+esc(o.status)+' · <span style="color:#ffbd6b">'+tags.join(' · ')+'</span></button>';
    }).join('');
    return '<div class="warn-box"><div class="warn-h">⚠ '+flagged.length+' order perlu perhatian (terlalu lama / lewat deadline)</div>'+items+'</div>';
  }

  // ── Order rows ──
  function orderRows(orders){
    if (!orders.length) return '<tr data-no-sort="1"><td colspan="15" style="text-align:center;color:#888">Tidak ada order aktif.</td></tr>';
    var now = Date.now();
    return orders.map(function(o){
      var margin = (Number(o.hargaJual)||0) - (Number(o.hpp)||0);
      var num = parseInt(String(o.orderId).replace(/\D/g,''),10)||0;
      var days = o.estMs ? Math.ceil((o.estMs - now)/86400000) : null;
      var dlColor = days===null ? '' : (days<0 ? '#cc3333' : (days<=3 ? '#e0912f' : ''));
      var dlStyle = dlColor ? ' style="color:'+dlColor+';font-weight:700"' : '';
      var link = '';
      if (o.trackingLink){ link += '<button class="cbtn" data-l="'+esc(o.trackingLink)+'" onclick="copyBtn(this)">salin</button> <a class="link" href="'+esc(o.trackingLink)+'" target="_blank">buka</a>'; }
      if (o.driveLink) link += (link?' · ':'') + '<a class="link" href="'+esc(o.driveLink)+'" target="_blank">drive</a>';
      var search = (o.orderId+' '+o.customer+' '+o.product).toLowerCase();
      var w = o.warn||{};
      var wTip = [];
      if (w.aging) wTip.push('Sudah '+w.ageDays+' hari sejak inquiry masuk');
      if (w.overdue) wTip.push('Lewat deadline '+w.overdueDays+' hari');

  // ── Generic column sort ──
  function sortT(th, idx){
    var table = th.closest('table');
    var tbody = table.tBodies[0];
    var rows = Array.prototype.slice.call(tbody.rows).filter(function(r){ return !r.hasAttribute('data-no-sort'); });
    var dir = th.getAttribute('data-dir') === 'asc' ? 'desc' : 'asc';
    Array.prototype.forEach.call(th.parentNode.children, function(h){ h.removeAttribute('data-dir'); });
    th.setAttribute('data-dir', dir);
    rows.sort(function(a,b){
      var av = a.cells[idx].getAttribute('data-v'); if (av===null) av = a.cells[idx].textContent;
      var bv = b.cells[idx].getAttribute('data-v'); if (bv===null) bv = b.cells[idx].textContent;
      var an = parseFloat(av), bn = parseFloat(bv), cmp;
      if (!isNaN(an) && !isNaN(bn) && /^\s*-?\d/.test(av) && /^\s*-?\d/.test(bv)) cmp = an - bn;
      else cmp = String(av).localeCompare(String(bv));
      return dir==='asc' ? cmp : -cmp;
    });
    rows.forEach(function(r){ tbody.appendChild(r); });
  }

  function jsonp(url, cb){
    var name = 'jcb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    var s = document.createElement('script');
    var to = setTimeout(function(){ finish(null); }, 15000);
    function finish(d){ clearTimeout(to); delete window[name]; if (s.parentNode) s.parentNode.removeChild(s); cb(d); }
    window[name] = function(d){ finish(d); };
    s.onerror = function(){ finish(null); };
    s.src = url + '&callback=' + name + '&_=' + Date.now();
    document.body.appendChild(s);
  }

  function recalcInvoice(){
    var rows=document.querySelectorAll('#invRows tr'), sub=0;
    for(var i=0;i<rows.length;i++){
      var tr=rows[i];
      tr.querySelector('.inv-no').textContent=(i+1)+'.';
      var lt=poNum(tr.querySelector('.inv-qty'))*poNum(tr.querySelector('.inv-price'));
      tr.querySelector('.inv-line').textContent=rpv(lt);
      sub+=lt;
    }
    var grand=sub-invNum('inv-disc')+invNum('inv-ship');
    invSet('inv-subtotal-v', rpv(sub));
    invSet('inv-grand-v', rpv(grand));
    var dp=invNum('inv-dp');
    if(INV_TYPE==='dp'){
      invSet('inv-dppct', (grand? Math.round(dp/grand*100):0)+'%');
      invSet('inv-due-v', rpv(dp));
      invSet('inv-remain-v', rpv(grand-dp));
    } else {
      invSet('inv-remain-v', rpv(grand-dp));
    }
  }

  // ── Set foto ke slot + crop (cover) yang bisa digeser/di-zoom ──
  function setSlotImg(el, dataUrl){
    el.setAttribute('data-img',dataUrl); el.setAttribute('data-zoom','1'); el.setAttribute('data-px','50'); el.setAttribute('data-py','50'); el.textContent='';
    var im=new Image();
    im.onload=function(){
      var sw=el.clientWidth||1, sh=el.clientHeight||1;
      var cw=Math.max(100, 100*(sh*im.naturalWidth)/(sw*im.naturalHeight));  // % lebar agar minimal cover
      el.setAttribute('data-coverw', cw); renderSlot(el);
    };
    im.src=dataUrl;
  }
  function renderSlot(el){
    var img=el.getAttribute('data-img'); if(!img) return;
    var cw=parseFloat(el.getAttribute('data-coverw')||'100'), zoom=parseFloat(el.getAttribute('data-zoom')||'1');
    var px=parseFloat(el.getAttribute('data-px')||'50'), py=parseFloat(el.getAttribute('data-py')||'50');
    el.style.backgroundImage='url('+img+')'; el.style.backgroundRepeat='no-repeat';
    el.style.backgroundSize=(cw*zoom)+'%'; el.style.backgroundPosition=px+'% '+py+'%';
  }
  function slotPanStart(e,el){ if(!el.getAttribute('data-img')) return; PAN={el:el,x:e.clientX,y:e.clientY,px:parseFloat(el.getAttribute('data-px')||'50'),py:parseFloat(el.getAttribute('data-py')||'50')}; e.preventDefault(); }
  function slotPanMove(e){ if(!PAN) return; var px=Math.max(0,Math.min(100,PAN.px-(e.clientX-PAN.x)*0.25)); var py=Math.max(0,Math.min(100,PAN.py-(e.clientY-PAN.y)*0.25)); PAN.el.setAttribute('data-px',px); PAN.el.setAttribute('data-py',py); renderSlot(PAN.el); }
  function slotWheel(e,el){ if(!el.getAttribute('data-img')) return; e.preventDefault(); var z=parseFloat(el.getAttribute('data-zoom')||'1'); z=Math.max(1,Math.min(4, z+(e.deltaY<0?0.1:-0.1))); el.setAttribute('data-zoom',z); renderSlot(el); }
  document.addEventListener('mousemove', slotPanMove);
  document.addEventListener('mouseup', function(){ PAN=null; });

    var form=document.createElement('form'); form.method='POST'; form.action=WEB_APP_URL; form.target='saveframe';
    function add(n,v){ var i=document.createElement('input'); i.type='hidden'; i.name=n; i.value=v; form.appendChild(i); }
    add('action','saveFile'); add('key',ADMIN_KEY); add('id',id); add('filename',filename); add('mime',mime); add('data',b64);
    document.body.appendChild(form); form.submit();
    setTimeout(function(){ document.body.removeChild(form); if(done) done(); }, 1800);
  }
  function saveSheetDrive(btn){
    if(!window.jspdf){ alert('jsPDF belum termuat.'); return; }
    var old=btn.textContent; btn.disabled=true; btn.textContent='Menyimpan…';
    sheetToPdf().then(function(r){
      var b64 = r.pdf.output('datauristring').split(',')[1];
      postFile(SHEET_ORDERID, 'Custom Sheet - '+SHEET_ORDERID+'.pdf', 'application/pdf', b64, function(){
        btn.disabled=false; btn.textContent=old; alert('Custom Sheet tersimpan ke folder Drive client ✅');
      });
    }).catch(function(e){ btn.disabled=false; btn.textContent=old; alert('Gagal: '+e.message); });
  }

  // ── Load ──
  function showErr(msg){ document.getElementById('content').innerHTML = '<div class="error">'+esc(msg)+'</div>'; }
  function loadData(){
    if (WEB_APP_URL.indexOf('PASTE_URL') > -1){ showErr('WEB_APP_URL belum diisi.'); return; }
    var cbName = 'cb_' + Date.now();
    var s = document.createElement('script');
    var timeout = setTimeout(function(){ cleanup(); showErr('Timeout — cek URL /exec, akses "Anyone", dan sudah redeploy.'); }, 15000);
    function cleanup(){ clearTimeout(timeout); delete window[cbName]; if (s.parentNode) s.parentNode.removeChild(s); }
    window[cbName] = function(d){ cleanup(); if (d && d.error){ showErr(d.error); return; } render(d); };
    s.onerror = function(){ cleanup(); showErr('Gagal konek ke server.'); };
    s.src = WEB_APP_URL + '?page=admin&format=json&callback=' + cbName + '&key=' + encodeURIComponent(ADMIN_KEY) + '&_=' + Date.now();
    document.body.appendChild(s);
  }
  loadData();
</script>
